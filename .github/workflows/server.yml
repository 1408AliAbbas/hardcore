name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        run: sudo apt update && sudo apt install openjdk-17-jdk -y

      - name: Download PaperMC
        run: wget https://api.papermc.io/v2/projects/paper/versions/1.20/builds/latest/downloads/paper.jar

      - name: Accept EULA
        run: echo "eula=true" > eula.txt

      - name: Start Minecraft Server
        run: java -Xmx4G -Xms2G -jar paper.jar nogui
