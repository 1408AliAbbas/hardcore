name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        run: sudo apt update && sudo apt install openjdk-17-jdk -y

      - name: Download Paper
  run: |
    VERSION=$(curl -s https://api.papermc.io/v2/projects/paper | jq -r '.versions[-1]')
    BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/$VERSION | jq -r '.builds[-1]')
    wget https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar -O paper.jar
      - name: Accept EULA
        run: echo "eula=true" > eula.txt

      - name: Start Minecraft Server
        run: java -Xmx4G -Xms2G -jar paper.jar nogui
